<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NoGas">
  <meta name="theme-color" content="#0a1628">
  <link rel="manifest" href="manifest.json">
  <title>NoGas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a1628; --surface: #111e35; --card: #162440; --border: #1e3356;
      --blue: #3b82f6; --ok: #10b981; --ng: #ef4444; --warn: #f59e0b;
      --text: #e2e8f0; --muted: #64748b;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; }
    .header { background: linear-gradient(135deg, #0f2547, #1a3a6e); padding: max(14px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .hicon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--blue), #06b6d4); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .header h1 { font-size: 16px; font-weight: 800; }
    .header-sub { font-size: 10px; color: var(--muted); margin-left: 36px; }
    .steps { display: flex; align-items: center; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .step { display: flex; align-items: center; gap: 5px; flex: 1; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; background: var(--border); color: var(--muted); flex-shrink: 0; transition: all 0.3s; }
    .step.active .step-num { background: var(--blue); color: white; }
    .step.done .step-num { background: var(--ok); color: white; }
    .step-label { font-size: 10px; color: var(--muted); }
    .step.active .step-label { color: var(--blue); font-weight: 600; }
    .step.done .step-label { color: var(--ok); }
    .step-line { width: 16px; height: 2px; background: var(--border); flex-shrink: 0; }
    .legend { display: flex; gap: 10px; padding: 6px 16px; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .danger { background: rgba(239,68,68,0.12); border-bottom: 1px solid rgba(239,68,68,0.3); padding: 6px 16px; font-size: 11px; color: #fca5a5; flex-shrink: 0; }
    .camera-zone { flex: 1; position: relative; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); padding: 20px; }
    .placeholder-icon { font-size: 44px; opacity: 0.4; }
    .placeholder-title { font-size: 15px; font-weight: 700; color: var(--text); text-align: center; }
    .placeholder-sub { font-size: 12px; text-align: center; line-height: 1.8; }
    .guide-wrap { position: absolute; inset: 0; display: none; pointer-events: none; }
    .guide-wrap.on { display: flex; align-items: center; justify-content: center; }
    .guide-box { width: 60%; height: 42%; border: 3px solid #facc15; border-radius: 10px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.45); position: relative; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{border-color:#facc15}50%{border-color:#fde047} }
    .guide-label { position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: white; background: rgba(0,0,0,0.75); padding: 3px 12px; border-radius: 20px; }
    .guide-tip { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 10px; color: #facc15; background: rgba(0,0,0,0.75); padding: 2px 10px; border-radius: 20px; }
    .phase-label { position: absolute; top: 10px; left: 0; right: 0; display: none; justify-content: center; pointer-events: none; }
    .phase-badge { background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700; color: white; }
    .thumbs { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 8px; }
    .thumb { width: 64px; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); display: none; }
    .thumb.show { display: block; }
    .thumb img { width: 100%; height: 64px; object-fit: cover; display: block; }
    .thumb-label { padding: 3px 5px; font-size: 9px; color: white; background: rgba(0,0,0,0.7); text-align: center; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tdot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .loading-overlay { position: absolute; inset: 0; background: rgba(10,22,40,0.85); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    .loading-overlay.show { display: flex; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; }
    .result-overlay.show { display: flex; }
    .result-overlay.ok { background: rgba(16,185,129,0.93); }
    .result-overlay.ng { background: rgba(239,68,68,0.93); }
    .result-overlay.warn { background: rgba(245,158,11,0.93); }
    .result-icon { font-size: 64px; }
    .result-title { font-size: 36px; font-weight: 900; color: white; }
    .result-sub { font-size: 14px; color: rgba(255,255,255,0.95); text-align: center; line-height: 1.6; font-weight: 700; }
    .result-detail { font-size: 12px; color: rgba(255,255,255,0.85); text-align: center; line-height: 1.8; white-space: pre-line; }
    .btn-zone { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px max(12px, env(safe-area-inset-bottom)); display: flex; gap: 10px; }
    .btn { flex: 1; padding: 16px 8px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; -webkit-appearance: none; transition: all 0.15s; }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn-blue { background: linear-gradient(135deg, var(--blue), #2563eb); color: white; box-shadow: 0 4px 16px rgba(59,130,246,0.4); }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; box-shadow: 0 4px 16px rgba(139,92,246,0.4); }
    .btn-green { background: linear-gradient(135deg, var(--ok), #059669); color: white; box-shadow: 0 4px 16px rgba(16,185,129,0.4); }
    .btn-ghost { background: var(--card); border: 1.5px solid var(--border); color: var(--muted); }
    .btn-reset { background: var(--card); border: 1.5px solid var(--border); color: var(--text); font-size: 13px; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="hicon">🧪</div>
      <h1>NoGas — ボトル確認</h1>
    </div>
    <div class="header-sub">機器ラベル → ボトルラベルの色を照合して取り違えを防止</div>
  </div>
  <div class="steps">
    <div class="step active" id="step1"><div class="step-num">1</div><div class="step-label">機器撮影</div></div>
    <div class="step-line"></div>
    <div class="step" id="step2"><div class="step-num">2</div><div class="step-label">ボトル撮影</div></div>
    <div class="step-line"></div>
    <div class="step" id="step3"><div class="step-num">3</div><div class="step-label">照合結果</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#1a3a6e;border:1px solid #3b82f6;"></div>濃紺ラベル = Sanacide-XP</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1a5c2a;border:1px solid #22c55e;"></div>濃緑ラベル = ECO-200</div>
  </div>
  <div class="danger">⚠️ <strong>混合厳禁：</strong>酢酸＋次亜塩素酸 → 塩素ガス発生！補充前に必ず確認！</div>

  <div class="camera-zone">
    <video id="video" autoplay playsinline muted></video>
    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon" id="ph-icon">🏥</div>
      <div class="placeholder-title" id="ph-title">機器側のラベルを撮影</div>
      <div class="placeholder-sub" id="ph-sub">下の青いボタンでカメラを起動<br>📌 <strong style="color:#facc15;">ラベルの色の部分</strong>を<br>黄色い枠いっぱいに近づけて撮影</div>
    </div>
    <div class="phase-label" id="phase-label"><div class="phase-badge" id="phase-badge"></div></div>
    <div class="guide-wrap" id="guide-wrap">
      <div class="guide-box">
        <div class="guide-tip">ラベルの色部分を枠いっぱいに</div>
        <div class="guide-label">近づけて撮影してください</div>
      </div>
    </div>
    <div class="thumbs">
      <div class="thumb" id="thumb1"><img id="img1" alt="機器"><div class="thumb-label"><div class="tdot" id="tdot1"></div><span id="tlabel1">機器</span></div></div>
      <div class="thumb" id="thumb2"><img id="img2" alt="ボトル"><div class="thumb-label"><div class="tdot" id="tdot2"></div><span id="tlabel2">ボトル</span></div></div>
    </div>
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div style="color:var(--muted);font-size:13px;">ラベルの色を解析中...</div>
    </div>
    <div class="result-overlay" id="result-overlay">
      <div class="result-icon" id="r-icon"></div>
      <div class="result-title" id="r-title"></div>
      <div class="result-sub" id="r-sub"></div>
      <div class="result-detail" id="r-detail"></div>
    </div>
  </div>

  <div class="btn-zone">
    <button class="btn btn-blue" id="main-btn" onclick="mainAction()">📷 カメラ起動（機器側）</button>
    <button class="btn btn-ghost" id="sub-btn" onclick="subAction()" style="display:none;">✕ 停止</button>
  </div>
</div>
<canvas id="canvas" style="display:none;"></canvas>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

  const STATE = { MACHINE_READY:0, MACHINE_CAM:1, BOTTLE_READY:2, BOTTLE_CAM:3, RESULT:4 };
  let state = STATE.MACHINE_READY;
  let stream = null;
  let colors = [null, null];

  const COLOR_INFO = {
    navy:    { name: '濃紺色', product: 'Sanacide-XP（酢酸系）', dotStyle: 'background:#1a3a6e;' },
    green:   { name: '濃緑色', product: 'ECO-200（塩素系）',     dotStyle: 'background:#1a5c2a;' },
    unknown: { name: '判定不能', product: '不明',                dotStyle: 'background:#64748b;' }
  };

  function mainAction() {
    if (state === STATE.MACHINE_READY) startCam('machine');
    else if (state === STATE.MACHINE_CAM) capture('machine');
    else if (state === STATE.BOTTLE_READY) startCam('bottle');
    else if (state === STATE.BOTTLE_CAM) capture('bottle');
    else if (state === STATE.RESULT) resetAll();
  }

  function subAction() {
    stopCam();
    setState(state === STATE.MACHINE_CAM ? STATE.MACHINE_READY : STATE.BOTTLE_READY);
  }

  async function startCam(phase) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      const v = document.getElementById('video');
      v.srcObject = stream;
      v.style.display = 'block';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('phase-label').style.display = 'flex';
      document.getElementById('guide-wrap').classList.add('on');
      document.getElementById('phase-badge').textContent =
        phase === 'machine' ? '📷 機器ラベルの色部分を枠いっぱいに' : '📷 ボトルラベルの色部分を枠いっぱいに';
      setState(phase === 'machine' ? STATE.MACHINE_CAM : STATE.BOTTLE_CAM);
    } catch(e) {
      alert('カメラを起動できませんでした。\n設定 → Safari → カメラ → 許可\nにしてから再度お試しください。');
    }
  }

  function stopCam() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const v = document.getElementById('video');
    v.style.display = 'none'; v.srcObject = null;
    document.getElementById('guide-wrap').classList.remove('on');
    document.getElementById('phase-label').style.display = 'none';
  }

  function capture(phase) {
    const v = document.getElementById('video');
    const c = document.getElementById('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    stopCam();
    const idx = phase === 'machine' ? 0 : 1;
    const n = idx + 1;
    const color = analyzeColor(c);
    colors[idx] = color;
    document.getElementById('img' + n).src = c.toDataURL('image/jpeg', 0.8);
    document.getElementById('thumb' + n).classList.add('show');
    const info = COLOR_INFO[color];
    document.getElementById('tdot' + n).style = 'width:8px;height:8px;border-radius:2px;flex-shrink:0;' + info.dotStyle;
    document.getElementById('tlabel' + n).textContent = info.name;
    if (phase === 'machine') {
      document.getElementById('placeholder').style.display = 'flex';
      document.getElementById('ph-icon').textContent = '🧴';
      document.getElementById('ph-title').textContent = 'ボトルのラベルを撮影';
      document.getElementById('ph-sub').textContent = '下の紫のボタンでカメラを起動\n📌 ラベルの色の部分を\n黄色い枠いっぱいに近づけて撮影';
      setState(STATE.BOTTLE_READY);
    } else {
      setState(STATE.RESULT);
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('loading').classList.add('show');
      setTimeout(() => { document.getElementById('loading').classList.remove('show'); showResult(); }, 700);
    }
  }

  // ====================================================
  // HSV色相（Hue）を使った色判定
  // 明るさ・照明に左右されない堅牢な方法
  // 濃紺：色相200〜260度
  // 濃緑：色相90〜165度
  // ====================================================
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    const s = max === 0 ? 0 : d / max;
    const v = max;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
    }
    return { h: h * 360, s, v };
  }

  function analyzeColor(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    // 画像全体をスキャン（広めに）
    let navy = 0, green = 0, total = 0;

    for (let y = 0; y < h; y += 5) {
      for (let x = 0; x < w; x += 5) {
        const p = ctx.getImageData(x, y, 1, 1).data;
        const hsv = rgbToHsv(p[0], p[1], p[2]);

        // 彩度0.2以上（白・グレーを除外）
        // 明度0.1〜0.9（真っ黒・真っ白を除外）
        if (hsv.s < 0.20 || hsv.v < 0.10 || hsv.v > 0.92) continue;

        total++;

        // 濃緑：色相90〜165度（草色〜深緑）
        if (hsv.h >= 90 && hsv.h <= 165) green++;

        // 濃紺：色相200〜265度（青〜紺）
        if (hsv.h >= 200 && hsv.h <= 265) navy++;
      }
    }

    const nr = total > 0 ? navy / total : 0;
    const gr = total > 0 ? green / total : 0;
    console.log(`合計:${total} | 緑:${green}(${(gr*100).toFixed(1)}%) | 紺:${navy}(${(nr*100).toFixed(1)}%)`);

    // 有効ピクセルが少なすぎる場合
    if (total < 8) return 'unknown';

    // どちらも閾値以下なら判定不能
    if (gr < 0.04 && nr < 0.04) return 'unknown';

    // 緑が紺の1.2倍以上 → 緑
    if (gr > nr * 1.2) return 'green';

    // 紺が緑の1.2倍以上 → 紺
    if (nr > gr * 1.2) return 'navy';

    return 'unknown';
  }

  function showResult() {
    const c1 = colors[0], c2 = colors[1];
    const overlay = document.getElementById('result-overlay');
    overlay.className = 'result-overlay show';
    const i1 = COLOR_INFO[c1], i2 = COLOR_INFO[c2];
    if (c1 === 'unknown' || c2 === 'unknown') {
      overlay.classList.add('warn');
      document.getElementById('r-icon').textContent = '⚠️';
      document.getElementById('r-title').textContent = '再撮影';
      document.getElementById('r-sub').textContent = 'ラベルの色部分が判定できませんでした';
      document.getElementById('r-detail').textContent =
        'ラベルの色の部分だけを\n黄色い枠いっぱいになるよう\nカメラをラベルに近づけて撮影してください';
    } else if (c1 === c2) {
      overlay.classList.add('ok');
      document.getElementById('r-icon').textContent = '✅';
      document.getElementById('r-title').textContent = '一致！';
      document.getElementById('r-sub').textContent = '正しいボトルです\n補充してください';
      document.getElementById('r-detail').textContent =
        '機器ラベル：' + i1.name + '（' + i1.product + '）\nボトルラベル：' + i2.name + '（' + i2.product + '）';
    } else {
      overlay.classList.add('ng');
      document.getElementById('r-icon').textContent = '❌';
      document.getElementById('r-title').textContent = '取り違え！';
      document.getElementById('r-sub').textContent = '直ちに補充を中止してください！';
      document.getElementById('r-detail').textContent =
        '機器ラベル：' + i1.name + '（' + i1.product + '）\nボトルラベル：' + i2.name + '（' + i2.product + '）\n\n⚠️ 混合すると塩素ガスが発生します！';
    }
  }

  function setState(s) {
    state = s;
    const mainBtn = document.getElementById('main-btn');
    const subBtn = document.getElementById('sub-btn');
    subBtn.style.display = 'none';
    const stepMap = { 0:1, 1:1, 2:2, 3:2, 4:3 };
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById('step' + i);
      el.classList.remove('active', 'done');
      const cur = stepMap[s];
      if (i < cur) el.classList.add('done');
      else if (i === cur) el.classList.add('active');
    }
    if (s === STATE.MACHINE_READY) { mainBtn.className = 'btn btn-blue'; mainBtn.textContent = '📷 カメラ起動（機器側）'; }
    else if (s === STATE.MACHINE_CAM) { mainBtn.className = 'btn btn-green'; mainBtn.textContent = '📸 撮影する（機器側）'; subBtn.style.display = 'block'; }
    else if (s === STATE.BOTTLE_READY) { mainBtn.className = 'btn btn-purple'; mainBtn.textContent = '📷 カメラ起動（ボトル側）'; }
    else if (s === STATE.BOTTLE_CAM) { mainBtn.className = 'btn btn-green'; mainBtn.textContent = '📸 撮影する（ボトル側）'; subBtn.style.display = 'block'; }
    else if (s === STATE.RESULT) { mainBtn.className = 'btn btn-reset'; mainBtn.textContent = '🔄 最初からやり直す'; }
  }

  function resetAll() {
    stopCam(); colors = [null, null];
    document.getElementById('thumb1').classList.remove('show');
    document.getElementById('thumb2').classList.remove('show');
    document.getElementById('result-overlay').className = 'result-overlay';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('ph-icon').textContent = '🏥';
    document.getElementById('ph-title').textContent = '機器側のラベルを撮影';
    document.getElementById('ph-sub').textContent = '下の青いボタンでカメラを起動\n📌 ラベルの色の部分を\n黄色い枠いっぱいに近づけて撮影';
    setState(STATE.MACHINE_READY);
  }
</script>
</body>
</html>
