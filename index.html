<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ボトル確認">
  <meta name="theme-color" content="#0a1628">
  <link rel="manifest" href="manifest.json">
  <title>透析ボトル確認システム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a1628;
      --surface: #111e35;
      --card: #162440;
      --border: #1e3356;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --ok-color: #10b981;
      --ng-color: #ef4444;
      --warn-color: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #64748b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0f2547, #1a3a6e);
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      padding-top: max(16px, env(safe-area-inset-top));
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 42px;
    }

    /* Main scroll area */
    .main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Step indicator */
    .steps {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      gap: 4px;
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      background: var(--border);
      color: var(--text-muted);
      transition: all 0.3s;
    }

    .step.active .step-num {
      background: var(--accent-blue);
      color: white;
      box-shadow: 0 0 12px rgba(59,130,246,0.5);
    }

    .step.done .step-num {
      background: var(--ok-color);
      color: white;
    }

    .step-label {
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.2;
    }

    .step.active .step-label { color: var(--accent-blue); }
    .step.done .step-label { color: var(--ok-color); }

    .step-line {
      width: 24px;
      height: 2px;
      background: var(--border);
      flex-shrink: 0;
      margin-bottom: 14px;
    }

    /* Machine selector */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .machine-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .machine-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      -webkit-appearance: none;
    }

    .machine-btn:active { transform: scale(0.97); }

    .machine-btn.selected {
      border-color: var(--accent-blue);
      background: rgba(59,130,246,0.12);
      box-shadow: 0 0 16px rgba(59,130,246,0.2);
    }

    .machine-btn .machine-icon { font-size: 22px; margin-bottom: 6px; }
    .machine-btn .machine-name { font-size: 13px; font-weight: 600; display: block; }
    .machine-btn .machine-desc { font-size: 10px; color: var(--text-muted); margin-top: 3px; display: block; }
    .machine-btn.selected .machine-desc { color: var(--accent-cyan); }

    /* Camera area */
    .camera-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .camera-header {
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .camera-badge {
      font-size: 9px;
      background: var(--accent-blue);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .video-wrap {
      position: relative;
      background: #000;
      aspect-ratio: 3/4;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cam-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .cam-placeholder-icon {
      font-size: 48px;
      opacity: 0.4;
    }

    .cam-placeholder-text {
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .scan-overlay.active { display: block; }

    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      aspect-ratio: 2/3;
      border: 2px solid rgba(59,130,246,0.7);
      border-radius: 12px;
    }

    .scan-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--accent-cyan);
      border-style: solid;
    }

    .scan-corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scan-corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scan-corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      animation: scan 2s ease-in-out infinite;
    }

    @keyframes scan {
      0%, 100% { top: 5%; opacity: 1; }
      50% { top: 95%; opacity: 0.6; }
    }

    .camera-controls {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-appearance: none;
      letter-spacing: 0.03em;
      font-family: inherit;
    }

    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-blue {
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      color: white;
      box-shadow: 0 4px 20px rgba(59,130,246,0.3);
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
      color: white;
      box-shadow: 0 4px 20px rgba(6,182,212,0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      padding: 12px;
    }

    /* Preview */
    .preview-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .preview-wrap.show { display: block; }
    #preview-img { width: 100%; height: 180px; object-fit: cover; display: block; }

    .preview-label {
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Loading */
    .loading-area {
      display: none;
      padding: 20px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .loading-area.show { display: flex; }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Result */
    .result-card {
      display: none;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid;
    }

    .result-card.show { display: block; }
    .result-card.ok { border-color: var(--ok-color); }
    .result-card.ng { border-color: var(--ng-color); }
    .result-card.warn { border-color: var(--warn-color); }

    .result-banner {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .result-card.ok .result-banner { background: rgba(16,185,129,0.15); }
    .result-card.ng .result-banner { background: rgba(239,68,68,0.15); }
    .result-card.warn .result-banner { background: rgba(245,158,11,0.15); }

    .result-icon {
      font-size: 48px;
      line-height: 1;
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .result-card.ok .result-title { color: var(--ok-color); }
    .result-card.ng .result-title { color: var(--ng-color); }
    .result-card.warn .result-title { color: var(--warn-color); }

    .result-subtitle {
      font-size: 13px;
      margin-top: 4px;
      font-weight: 600;
    }

    .result-detail {
      padding: 14px 20px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .result-detail strong {
      color: var(--text);
    }

    /* Danger warning */
    .danger-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #fca5a5;
      line-height: 1.6;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    /* Footer */
    .footer {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #canvas { display: none; }

    /* Disabled state message */
    .disabled-msg {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="header-icon">🧪</div>
      <h1>透析ボトル確認システム</h1>
    </div>
    <div class="header-sub">Sanacide-XP / ECO-200 取り違え防止</div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Steps -->
    <div class="steps">
      <div class="step active" id="step1">
        <div class="step-num">1</div>
        <div class="step-label">機器<br>選択</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step2">
        <div class="step-num">2</div>
        <div class="step-label">撮影</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step3">
        <div class="step-num">3</div>
        <div class="step-label">AI<br>判定</div>
      </div>
    </div>

    <!-- Step 1: Machine selection -->
    <div id="section-machine">
      <div class="section-title">① 使用する機器を選択</div>
      <div class="machine-grid">
        <button class="machine-btn" onclick="selectMachine('sanacide-xp', this)">
          <div class="machine-icon">🔵</div>
          <span class="machine-name">Sanacide-XP</span>
          <span class="machine-desc">酢酸系・酸性タイプ<br>紺色ラベル</span>
        </button>
        <button class="machine-btn" onclick="selectMachine('eco-200', this)">
          <div class="machine-icon">🟢</div>
          <span class="machine-name">ECO-200</span>
          <span class="machine-desc">次亜塩素酸・塩素系<br>緑色ラベル</span>
        </button>
      </div>
      <div class="disabled-msg" id="machine-hint" style="margin-top:8px;">
        補充するボトルの機器を選んでください
      </div>
    </div>

    <!-- Danger warning -->
    <div class="danger-box">
      ⚠️ <span><strong>混合厳禁：</strong>酢酸と次亜塩素酸を混合すると<strong>塩素ガスが発生</strong>します。必ず正しいボトルを確認してから補充してください。</span>
    </div>

    <!-- Step 2: Camera -->
    <div id="section-camera">
      <div class="section-title">② 補充するボトルを撮影</div>
      <div class="camera-card">
        <div class="camera-header">
          カメラ <span class="camera-badge">AI判定</span>
        </div>
        <div class="video-wrap">
          <video id="video" autoplay playsinline muted></video>
          <div class="cam-placeholder" id="cam-placeholder">
            <div class="cam-placeholder-icon">📷</div>
            <div class="cam-placeholder-text">機器を選択後<br>カメラを起動してください</div>
          </div>
          <div class="scan-overlay" id="scan-overlay">
            <div class="scan-frame">
              <div class="scan-corner tl"></div>
              <div class="scan-corner tr"></div>
              <div class="scan-corner bl"></div>
              <div class="scan-corner br"></div>
              <div class="scan-line"></div>
            </div>
          </div>
        </div>
        <div class="camera-controls">
          <button class="btn-primary btn-blue" id="start-btn" onclick="startCamera()" disabled>
            📷 カメラを起動
          </button>
          <button class="btn-primary btn-cyan" id="capture-btn" onclick="capturePhoto()" style="display:none;">
            📸 撮影する
          </button>
          <button class="btn-primary btn-outline" id="stop-btn" onclick="stopCamera()" style="display:none;">
            ✕ カメラを停止
          </button>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" alt="撮影画像">
      <div class="preview-label">📌 撮影完了 — この画像でAI判定します</div>
    </div>

    <!-- Loading -->
    <div class="loading-area" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">AIがボトルを判定中...</div>
    </div>

    <!-- Result -->
    <div class="result-card" id="result-card">
      <div class="result-banner">
        <div class="result-icon" id="result-icon"></div>
        <div>
          <div class="result-title" id="result-title"></div>
          <div class="result-subtitle" id="result-subtitle"></div>
        </div>
      </div>
      <div class="result-detail" id="result-detail"></div>
    </div>

    <!-- Reset button -->
    <button class="btn-primary btn-outline" id="reset-btn" onclick="resetAll()" style="display:none;">
      🔄 最初からやり直す
    </button>

    <div style="height:8px;"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div style="text-align:center; font-size:11px; color:var(--text-muted);">
      透析器洗浄ボトル取り違え防止システム v1.0
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
  // PWA Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  let selectedMachine = null;
  let stream = null;
  let capturedImageBase64 = null;

  function selectMachine(type, btn) {
    selectedMachine = type;
    document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('start-btn').disabled = false;
    document.getElementById('machine-hint').textContent = 
      type === 'sanacide-xp' 
        ? '✅ Sanacide-XP（酢酸系）の機器を選択しました'
        : '✅ ECO-200（次亜塩素酸）の機器を選択しました';
    setStep(2);

    // Reset result if re-selecting
    hideResult();
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        }
      });
      const video = document.getElementById('video');
      video.srcObject = stream;
      video.style.display = 'block';
      document.getElementById('cam-placeholder').style.display = 'none';
      document.getElementById('scan-overlay').classList.add('active');
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('capture-btn').style.display = 'block';
      document.getElementById('stop-btn').style.display = 'block';
      hideResult();
    } catch (e) {
      alert('カメラへのアクセスができませんでした。\nブラウザの設定でカメラを許可してください。\n\nエラー: ' + e.message);
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    const video = document.getElementById('video');
    video.style.display = 'none';
    document.getElementById('cam-placeholder').style.display = 'flex';
    document.getElementById('cam-placeholder').innerHTML = '<div class="cam-placeholder-icon">📷</div><div class="cam-placeholder-text">カメラを起動してください</div>';
    document.getElementById('scan-overlay').classList.remove('active');
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('capture-btn').style.display = 'none';
    document.getElementById('stop-btn').style.display = 'none';
  }

  function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

    // Show preview
    document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.85);
    document.getElementById('preview-wrap').classList.add('show');

    stopCamera();
    setStep(3);
    judgeBottle();
  }

  async function judgeBottle() {
    document.getElementById('loading').classList.add('show');
    hideResult();
    document.getElementById('reset-btn').style.display = 'none';

    const machineLabel = selectedMachine === 'sanacide-xp' ? 'Sanacide-XP（酢酸系）' : 'ECO-200（次亜塩素酸）';

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 300,
          system: `あなたは透析器洗浄に使う薬剤ボトルを識別する安全確認システムです。
画像を見て、ボトルの種類を判定してください。
必ずJSON形式のみで回答してください（マークダウン・前置き・後置き不要）。

判定対象：
- Sanacide-XP: 酢酸系・酸性タイプ・紺色または青色ラベル・透明〜薄い液体・「Sanacide」「サナサイド」の文字
- ECO-200: 次亜塩素酸ナトリウム・塩素系・緑色ラベル・黄緑色液体・「ECO」の文字
- unknown: ボトルが写っていない・ラベルが不鮮明・判定不能

回答形式：
{"bottle": "sanacide-xp"} または {"bottle": "eco-200"} または {"bottle": "unknown"}`,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: { type: 'base64', media_type: 'image/jpeg', data: capturedImageBase64 }
              },
              {
                type: 'text',
                text: `このボトルはSanacide-XPとECO-200のどちらですか？JSONのみで回答してください。`
              }
            ]
          }]
        })
      });

      const data = await response.json();
      const text = data.content?.find(c => c.type === 'text')?.text || '{"bottle":"unknown"}';
      
      let result;
      try {
        const clean = text.replace(/```json|```/g, '').trim();
        result = JSON.parse(clean);
      } catch {
        result = { bottle: 'unknown' };
      }

      document.getElementById('loading').classList.remove('show');
      showResult(result.bottle);

    } catch (e) {
      document.getElementById('loading').classList.remove('show');
      showResult('error');
    }

    document.getElementById('reset-btn').style.display = 'block';
  }

  function showResult(detected) {
    const card = document.getElementById('result-card');
    const icon = document.getElementById('result-icon');
    const title = document.getElementById('result-title');
    const subtitle = document.getElementById('result-subtitle');
    const detail = document.getElementById('result-detail');

    card.classList.add('show');
    card.className = 'result-card show';

    const machineName = selectedMachine === 'sanacide-xp' ? 'Sanacide-XP' : 'ECO-200';
    const machineType = selectedMachine === 'sanacide-xp' ? '酢酸系' : '次亜塩素酸';
    const detectedName = detected === 'sanacide-xp' ? 'Sanacide-XP' : detected === 'eco-200' ? 'ECO-200' : null;

    if (detected === 'unknown' || detected === 'error') {
      card.classList.add('warn');
      icon.textContent = '⚠️';
      title.textContent = '判定不能';
      subtitle.textContent = 'ボトルを再撮影してください';
      detail.innerHTML = detected === 'error'
        ? '<strong>通信エラー：</strong>インターネット接続を確認して再試行してください。'
        : `ボトルのラベルが鮮明に写るように、<strong>近づけて再撮影</strong>してください。<br><br>ラベルの文字・色が見えるように明るい場所で撮影してください。`;
    } else if (detected === selectedMachine) {
      card.classList.add('ok');
      icon.textContent = '✅';
      title.textContent = '正しい';
      subtitle.textContent = `${machineName}（${machineType}）を確認しました`;
      detail.innerHTML = `<strong>判定結果：</strong>${detectedName} を検出<br><strong>選択した機器：</strong>${machineName}<br><br>✅ 正しいボトルです。補充を続けてください。`;
    } else {
      card.classList.add('ng');
      icon.textContent = '❌';
      title.textContent = '取り違え！';
      subtitle.textContent = '補充を中止してください';
      detail.innerHTML = `<strong>⚠️ 危険：</strong>ボトルが異なります！<br><br><strong>選択した機器：</strong>${machineName}（${machineType}）<br><strong>検出されたボトル：</strong>${detectedName || '不明'}<br><br>🚨 <strong>混合すると塩素ガスが発生します。</strong>直ちに補充を中止し、正しいボトルを確認してください。`;
    }

    // Scroll to result
    setTimeout(() => {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }

  function hideResult() {
    const card = document.getElementById('result-card');
    card.className = 'result-card';
  }

  function resetAll() {
    selectedMachine = null;
    capturedImageBase64 = null;
    stopCamera();

    document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('start-btn').disabled = true;
    document.getElementById('machine-hint').textContent = '補充するボトルの機器を選んでください';
    document.getElementById('preview-wrap').classList.remove('show');
    document.getElementById('loading').classList.remove('show');
    hideResult();
    document.getElementById('reset-btn').style.display = 'none';

    setStep(1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setStep(n) {
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById('step' + i);
      el.classList.remove('active', 'done');
      if (i < n) el.classList.add('done');
      else if (i === n) el.classList.add('active');
    }
  }
</script>
</body>
</html>
